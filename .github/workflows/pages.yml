name: Pages

# Two concerns on purpose. `verify` is real CI and stands on its own: it runs the
# theme's contracts and the test suite on every push and pull request, and never
# depends on hosting. `build`/`deploy` publish the site and are gated on it, so a
# failing contrast assertion fails the deploy rather than shipping a shop window
# for a broken theme.
#
# ONE-TIME SETUP: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top: `verify` executes code from pull-request branches,
# so the workflow-wide default grants it nothing beyond reading the checkout.
# Only the jobs that actually publish are given the Pages tokens.
permissions:
  contents: read

jobs:
  verify:
    name: Verify theme contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contrast, separation and key coverage
        run: |
          python3 tools/build_theme.py --check
          python3 tools/validate_theme.py
      - name: Tests
        run: python3 tools/test_build.py

  build:
    name: Build site
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise only the publishing path. A shared group at workflow level would
    # queue pull-request verification behind main's deploys for no benefit.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the site from the committed theme
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
