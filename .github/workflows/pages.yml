name: Pages

# Two jobs on purpose. `verify` is real CI and stands on its own: it runs the
# theme's contracts on every push and never depends on hosting. `build`/`deploy`
# publish the site and are gated on it, so a failing contrast assertion fails the
# deploy rather than shipping a shop window for a broken theme.
#
# ONE-TIME SETUP: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The workflow token can deploy to Pages but cannot create the Pages site itself
# (that needs repo admin), so the first enable has to be done by a human. Until
# it is, `verify` passes and `build` fails at actions/configure-pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify theme contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contrast, separation and key coverage
        run: |
          python3 tools/build_theme.py --check
          python3 tools/validate_theme.py

  build:
    name: Build site
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the site from the committed theme
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
